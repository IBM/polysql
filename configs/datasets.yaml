# Dataset Configuration
#
# This file defines configurations for different datasets used in NL2DSL evaluation.
# Each dataset can have different source database types, gold query dialects, and field mappings.

datasets:
  # BIRD Development Set (default configuration)
  bird_dev:
    name: "bird_dev"
    data_path: "data/BIRD/dev_20240627/dev.json"
    source_db_type: "sqlite"
    gold_query_dialect: "sqlite"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "question_id"
    db_id_field: "db_id"

  # Archer Development Set
  archer_dev_s_and_c:
    name: "archer_dev_s_and_c"
    data_path: "data/archer/en_data/dev_simple_and_commonsense.json"
    source_db_type: "sqlite"
    gold_query_dialect: "sqlite"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "idx"
    db_id_field: "db_id"

  # Spider Development Set
  spider_dev:
    name: "spider_dev"
    data_path: "data/spider/dev.json"
    source_db_type: "sqlite"
    gold_query_dialect: "sqlite"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "idx"
    db_id_field: "db_id"

  # Spider Train Set
  spider_train:
    name: "spider_train"
    data_path: "data/spider/train_spider.json"
    source_db_type: "sqlite"
    gold_query_dialect: "sqlite"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "idx"
    db_id_field: "db_id"

  # Beaver DW Development Set
  beaver_dw:
    name: "beaver_dw"
    data_path: "data/beaver/dev_dw.json"
    source_db_type: "mysql"
    gold_query_dialect: "mysql"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "question_id"
    db_id_field: "db_id"

  # Beaver NW Development Set
  beaver_nw:
    name: "beaver_nw"
    data_path: "data/beaver/dev_nw.json"
    source_db_type: "mysql"
    gold_query_dialect: "mysql"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "question_id"
    db_id_field: "db_id"

  # BIRD Mini Dev - SQLite
  bird_mini_dev_sqlite:
    name: "bird_mini_dev_sqlite"
    data_path: "data/MINIDEV/mini_dev_sqlite.json"
    source_db_type: "sqlite"
    gold_query_dialect: "sqlite"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "question_id"
