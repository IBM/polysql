  # BIRD Mini Dev - PostgreSQL
  bird_mini_dev_postgres:
    name: "bird_mini_dev_postgres"
    data_path: "data/MINIDEV/mini_dev_postgresql.json"
    source_db_type: "postgres"
    gold_query_dialect: "postgres"
    gold_query_type: "sql"
    db_path_field: "db_path"
    gold_query_field: "sql_query"
    nl_query_field: "nl_query"
    question_id_field: "question_id"
    db_id_field: "db_id"

  # Spider2-Lite Local (SQLite only, with pre-computed gold results)
  spider2_lite:
    name: "spider2_lite"
    data_path: "data/spider2_lite/spider2-lite-local.jsonl"
    source_db_type: "sqlite"
    gold_query_dialect: "sqlite"
